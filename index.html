<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Pixel</title>

<style>
body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
#game {
    width: 320px;
    height: 480px;
    border: 5px solid black;
    background: #70c5ce;
    position: relative;
}
canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
}
#menu {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}
button {
    padding: 15px;
    font-size: 18px;
    cursor: pointer;
}
#score {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    font-size: 30px;
    color: white;
    text-shadow: 2px 2px black;
}
</style>
</head>

<body>

<div id="game">
    <div id="menu">
        <button onclick="start()">СТАРТ</button>
    </div>
