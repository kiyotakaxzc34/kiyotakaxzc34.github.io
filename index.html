<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flappy</title>
<style>
body { margin:0; background:#111; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { width:320px; height:480px; background:#70c5ce; }
</style>
</head>
<body>

<canvas id="c" width="160" height="240"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

let y = 120;
let v = 0;
let pipes = [{x:160,h:80}];
let score = 0;

document.addEventListener("click", ()=> v = -4);

function loop(){
    ctx.clearRect(0,0,160,240);

    // земля
    ctx.fillStyle="#ded895";
    ctx.fillRect(0,226,160,14);

    // птица
    v += 0.25;
    y += v;
    ctx.fillStyle="yellow";
    ctx.fillRect(40,y,10,10);

    // трубы
    if(pipes[pipes.length-1].x < 90){
        pipes.push({x:160,h:Math.random()*80+40});
    }

    for(let i=pipes.length-1;i>=0;i--){
        let p = pipes[i];
        p.x -= 1.5;

        ctx.fillStyle="green";
        ctx.fillRect(p.x,0,20,p.h);
        ctx.fillRect(p.x,p.h+70,20,240);

        // столкновение
        if(40+10 > p.x && 40 < p.x+20){
            if(y < p.h || y+10 > p.h+70){
                location.reload(); // рестарт
            }
        }

        // очки
        if(!p.passed && 40 > p.x+20){
            score++;
            p.passed = true;
            console.log("Score:", score);
        }

        if(p.x < -20) pipes.splice(i,1);
    }

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
